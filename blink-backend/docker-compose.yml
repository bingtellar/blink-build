services:
  # 1. THE SOVEREIGN LEDGER DATABASE
  db:
    image: postgres:15-alpine
    container_name: blink_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Locked to localhost. Isolated port 5433.
      - "127.0.0.1:5433:5432" 
    volumes:
      - blink_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. ISOLATED REDIS (For BullMQ Sweeper & Cron Workers)
  redis:
    image: redis:7-alpine
    container_name: blink_backend_redis
    command: redis-server --appendonly yes
    ports:
      # Locked to localhost. Isolated port 6380.
      - "127.0.0.1:6380:6379" 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  blink_backend_pgdata: